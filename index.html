                        <project-item 
                            title="Eyes On Them" 
                            img="assets/img/EyesOfThem.png"
                            tags="Unity 6.3, C#, Git, GitHub"
                            description="Survival horror en primera persona. El objetivo del juego es escapar de un laberinto mientras eres perseguido por 
                            diferentes enemigos. Tu única defensa es mantenerlos vigilados, ya que los enemigos solo pueden avanzar cuando no están siendo 
                            observados.<br> 
                            El juego presenta una atmósfera opresiva y una ambientación diseñada para generar tensión constante en el jugador. <br><br>
                            Rol Desempeñado: <span class='highlight'>Gameplay Programmer. </span> <br>

                            Proyecto desarrollado durante una Game Jam de 60 horas con tematica: <span style='font-weight: bold;'>Capacidad limitada.</span><br> 
                            Implementé un controlador en primera persona utilizando el Input System 
                            y un Audio Manager basado en el patrón Singleton para centralizar la gestión del sonido. Diseñé e integré sistemas clave como 
                            un sistema de inventario utilizando el patron object pooling y un sistema de vida basado en estados (daño, recuperación y muerte), 
                            asegurando una arquitectura modular y escalable."


                            repo="https://github.com/pabloleongamedev/EyesOfThem" demo="https://pleond.itch.io/eyes-on-them" preview="#">
                        </project-item>
                        
                        <project-item 
                            title="Wild Farm" 
                            img="assets/img/wildfarm1.png"
                            tags="Unity 6.3, C#, Git, GitHub"
                            description="Es un juego en vista top view, frenetico y divertido. El objetivo del juego es alimernar a los animales de la 
                            granja mientras evitsa ser envestido, el juego cuenta con niveles de dificultar para asegurar que todos puedan 
                            disfrutarlo. <br> <br>

                            Rol Desempeñado: <span class='highlight'>Gameplay Developer. </span> <br>
                            Proyecto adaptado y extendido a partir del pathway Junior Programmer de Unity. Implementé un sistema de generación de enemigos 
                            mediante un Spawn Manager con posiciones aleatorias optimizado con Object Pooling. Además, desarrollé un sistema de temporizador 
                            utilizando coroutines."
                            
                            repo="https://github.com/pabloleongamedev/WildFarm" preview="#" demo="https://pleond.itch.io/wild-farm">
                        </project-item>

                        <project-item

                            img="assets/img/AWhackAFood.png"

                            optimizado con Object Pooling. Además, desarrollé un sistema de temporizador utilizando coroutines."
                            repo="#" preview="#" demo="https://pleond.itch.io/whack-a-food">
